<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mint Clinics</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F6F5F1; color: #1B2433; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .box { text-align: center; padding: 24px; }
  .name { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .msg { color: #6B7280; font-size: 14px; margin-top: 6px; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #178473; border-right-color: transparent; margin: 18px auto 0; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="name">Mint Clinics</div>
  <div class="msg" id="msg">Opening your document...</div>
  <div class="spin" id="spin"></div>
</div>
<script>
  // Short links like /go/x7k2ab9q (or go.themintclinics.com/x7k2ab9q). The
  // code is resolved by the clinic's consent service, which returns where to
  // send the visitor (a consent form, a signed copy, or an invoice PDF).
  // GitHub Pages serves this same file as 404.html for every unknown path.
  var EXEC = 'https://script.google.com/macros/s/AKfycbzMyd9A0Gm9EroJuxMIfS8XxinVmAJZZ38x8BSxksS50_IG4LG9FZNoqwDAvhg7-CXszw/exec';
  var parts = location.pathname.split('/').filter(Boolean);
  var code = parts.length ? parts[parts.length - 1] : '';
  function stop(text) {
    document.getElementById('msg').textContent = text;
    document.getElementById('spin').style.display = 'none';
  }
  // go.themintclinics.com/reception is a bookmarkable pointer to the dashboard.
  // It carries no data; sign-in, Sheet access and the PIN still apply there.
  var DASHBOARD = 'https://script.google.com/macros/s/AKfycbz_q2lC4ACH3hs6R1840x-pissDNG6TSwTXmafLnCnWoK8OfqZ3RI9PFSVMFwbzBrDJRQ/exec';
  if (code === 'reception') {
    stop('Opening the dashboard...');
    document.getElementById('spin').style.display = '';
    location.replace(DASHBOARD);
  } else if (!/^[a-z0-9]{6,20}$/.test(code)) {
    stop('Minting smiles, brightening lives.');
  } else {
    fetch(EXEC + '?resolve=' + encodeURIComponent(code))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.url) location.replace(d.url); else throw new Error('no url'); })
      .catch(function () { location.replace(EXEC + '?k=' + encodeURIComponent(code)); });
  }
</script>
</body>
</html>
